name: CodeQL

on:
  push:
  pull_request:
  schedule:
    - cron: "17 2 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            build-mode: manual
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Set up Java 17
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Build pinned OpenSSL
        if: matrix.language == 'c-cpp'
        id: openssl
        run: >-
          python3 .github/scripts/build-openssl.py
          --prefix "$RUNNER_TEMP/desfire-openssl"
          --build-root "$RUNNER_TEMP/desfire-openssl-build"

      - name: Build native production targets
        if: matrix.language == 'c-cpp'
        env:
          OPENSSL_ROOT: ${{ steps.openssl.outputs.prefix }}
        run: |
          cmake -S . -B build/codeql -G Ninja \
            -DDESFIRE_CXX_STANDARD=23 \
            -DDESFIRE_BUILD_TESTS=OFF \
            -DDESFIRE_BUILD_EXAMPLES=OFF \
            -DDESFIRE_BUILD_PCSC=OFF \
            -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT" \
            -DOPENSSL_CRYPTO_LIBRARY="$OPENSSL_ROOT/lib/libcrypto.a" \
            -DOPENSSL_INCLUDE_DIR="$OPENSSL_ROOT/include"
          cmake --build build/codeql --parallel 2

      - name: Install Android compilation platform
        if: matrix.language == 'java-kotlin'
        run: |
          sdkmanager="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          "$sdkmanager" --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: Build Kotlin/JVM and Android sources
        if: matrix.language == 'java-kotlin'
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew -p sdk/kotlin --dependency-verification strict \
            --no-daemon --no-build-cache compileKotlin
          ./gradlew -p sdk/android --dependency-verification strict \
            --no-daemon --no-build-cache compileReleaseKotlin \
            :example-app:compileReleaseKotlin \
            -x verifyNativeRuntime

      - name: Analyze source
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: /language:${{ matrix.language }}
