name: Android release package

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  aar:
    name: Three-ABI AAR and Showcase APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate the repository Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install pinned Android platform and NDK
        shell: bash
        run: |
          sdkmanager="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          "$sdkmanager" --channel=3 --install \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;29.0.14206865"
          test -d "$ANDROID_SDK_ROOT/platforms/android-37.0"
          test -d "$ANDROID_SDK_ROOT/build-tools/37.0.0"
          ndk="$ANDROID_SDK_ROOT/ndk/29.0.14206865"
          test -f "$ndk/source.properties"
          echo "ANDROID_NDK_ROOT=$ndk" >> "$GITHUB_ENV"

      - name: Restore the verified OpenSSL source archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/openssl-3.5.8.tar.gz
          key: openssl-source-3.5.8-a8f84a39918ec641
          enableCrossOsArchive: false

      - name: Obtain and verify the pinned OpenSSL source archive
        shell: bash
        run: |
          archive="$RUNNER_TEMP/openssl-3.5.8.tar.gz"
          if [[ ! -f "$archive" ]]; then
            curl --fail --location --silent --show-error \
              --output "$archive.download" \
              https://github.com/openssl/openssl/releases/download/openssl-3.5.8/openssl-3.5.8.tar.gz
            mv "$archive.download" "$archive"
          fi
          echo "a8f84a39918ec6415ce765d9b429d313ba97b8143169c172e734b9514464f5b2  $archive" \
            | sha256sum --check --strict

      - name: Build and verify all Android native runtimes
        run: |
          python3 sdk/android/tools/build_native.py \
            --ndk "$ANDROID_NDK_ROOT" \
            --api 23 \
            --cxx-standard 26 \
            --archive "$RUNNER_TEMP/openssl-3.5.8.tar.gz" \
            --jobs 4

      - name: Assemble, lint, and compile Android test sources
        run: |
          ./gradlew -p sdk/android \
            --dependency-verification strict --no-daemon --no-build-cache --stacktrace \
            assembleRelease lintRelease compileDebugAndroidTestSources \
            :example-app:assembleDebug :example-app:assembleRelease \
            :example-app:lintDebug :example-app:lintRelease \
            :example-app:testDebugUnitTest \
            -PdesfireNativeDirectory="$PWD/sdk/android/build/native-jniLibs"

      - name: Verify packaged classes, notices, ABIs, ELF hashes, and APK alignment
        run: |
          python3 -m unittest discover -s sdk/android/tools -p 'test_*.py'
          python3 sdk/android/tools/verify_aar.py
          python3 sdk/android/tools/verify_apk.py \
            --zipalign "$ANDROID_SDK_ROOT/build-tools/37.0.0/zipalign"

      - name: Enable KVM for the Android emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Execute JNI and showcase smoke tests on a 16 KiB Android emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: '37.0'
          target: google_apis_ps16k
          channel: canary
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          script: >-
            ./gradlew -p sdk/android --dependency-verification strict --no-daemon
            --no-build-cache :connectedDebugAndroidTest :example-app:connectedDebugAndroidTest
            -PdesfireNativeDirectory=$GITHUB_WORKSPACE/sdk/android/build/native-jniLibs

      - name: Hash release evidence
        run: |
          sha256sum sdk/android/build/outputs/aar/*.aar
          sha256sum sdk/android/build/native/build-evidence.json
          sha256sum examples/android-app/build/outputs/apk/debug/*.apk
          sha256sum examples/android-app/build/outputs/apk/release/*.apk

      - name: Upload verified Android package and evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desfire-android-packages
          path: |
            sdk/android/build/outputs/aar/*.aar
            sdk/android/build/native/build-evidence.json
            sdk/android/build/native/OPENSSL-LICENSE.txt
            examples/android-app/build/outputs/apk/debug/*.apk
            examples/android-app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 30
