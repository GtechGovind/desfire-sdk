[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "desfire-ev3"
version = "0.1.0"
description = "Typed Python callbacks and bindings for the DESFire EV3 native C ABI"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]

[project.optional-dependencies]
test = ["build>=1.2", "mypy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
desfire_ev3 = ["py.typed"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["desfire_ev3"]
mypy_path = "src"

[tool.ruff]
line-length = 100
extend-exclude = [
    "src/desfire_ev3/_operations.py",
    "src/desfire_ev3/raw/operations_generated.py",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
