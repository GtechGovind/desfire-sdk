name: CodeQL

on:
  push:
  pull_request:
  schedule:
    - cron: "17 2 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            build-mode: manual
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Set up Java 17
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Build pinned OpenSSL
        if: matrix.language == 'c-cpp'
        id: openssl
        run: >-
          python3 .github/scripts/build-openssl.py
          --prefix "$RUNNER_TEMP/desfire-openssl"
          --build-root "$RUNNER_TEMP/desfire-openssl-build"

      - name: Build native production targets
        if: matrix.language == 'c-cpp'
        env:
          OPENSSL_ROOT: ${{ steps.openssl.outputs.prefix }}
        run: |
          cmake -S . -B build/codeql -G Ninja \
            -DDESFIRE_CXX_STANDARD=23 \
            -DDESFIRE_BUILD_TESTS=OFF \
            -DDESFIRE_BUILD_EXAMPLES=OFF \
            -DDESFIRE_BUILD_PCSC=OFF \
            -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT" \
            -DOPENSSL_CRYPTO_LIBRARY="$OPENSSL_ROOT/lib/libcrypto.a" \
            -DOPENSSL_INCLUDE_DIR="$OPENSSL_ROOT/include"
          cmake --build build/codeql --parallel 2

      - name: Install Android compilation platform
        if: matrix.language == 'java-kotlin'
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Build Kotlin/JVM and Android sources
        if: matrix.language == 'java-kotlin'
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew -p sdk/kotlin --dependency-verification strict \
            --no-daemon --no-build-cache compileKotlin
          native_directory="$RUNNER_TEMP/codeql-jni"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mkdir -p "$native_directory/$abi"
            for library in libdesfire_c.so libdesfire_jni.so libc++_shared.so; do
              : > "$native_directory/$abi/$library"
            done
          done
          ./gradlew -p sdk/android --dependency-verification strict \
            --no-daemon --no-build-cache compileReleaseKotlin \
            -PdesfireNativeDirectory="$native_directory"

      - name: Analyze source
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:${{ matrix.language }}
