name: Release SBOM and provenance

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: release-provenance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  provenance:
    name: Source archive, SBOM, and attestation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate supply-chain policy
        run: python3 tools/security/check-supply-chain.py

      - name: Prepare release directory
        run: mkdir -p artifacts

      - name: Generate source SBOM
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo
          anchore/syft@sha256:95fe0835e5bebc6f8b1f8acef68d47d63d594ef4c0f25c097ff853b23cbac74c
          dir:/repo -o cyclonedx-json=/repo/artifacts/desfire-sdk.cdx.json

      - name: Create deterministic source archive and checksums
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar --prefix=desfire-sdk/ HEAD \
            | gzip -n > artifacts/desfire-sdk-source.tar.gz
          sha256sum \
            artifacts/desfire-sdk-source.tar.gz \
            artifacts/desfire-sdk.cdx.json \
            > artifacts/SHA256SUMS

      - name: Attest source archive and SBOM
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/desfire-sdk-source.tar.gz
            artifacts/desfire-sdk.cdx.json

      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-${{ github.ref_name }}-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
